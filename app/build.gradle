plugins {
	id 'com.android.application'
}

android {
	compileSdk 34
	
	androidResources {
		noCompress 'ogg'
	}
	
	defaultConfig {
		applicationId "ru.unogame"
		namespace "ru.unogame"
		minSdkVersion 21
		targetSdkVersion 34
		versionCode 9485
		versionName "0.41"
	}
	
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
	
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
}
